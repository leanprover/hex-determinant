name = "hex-determinant"
defaultTargets = ["HexDeterminant"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "6ad58796dca6bae4936003412816e4e844055558"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "b55720b4d45a4701660eccc557022d6cb4016eaa"

[[lean_lib]]
name = "HexDeterminant"
precompileModules = true
