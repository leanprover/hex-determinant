name = "hex-determinant-bench"
defaultTargets = ["hexdeterminant_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexDeterminant"
path = ".."

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_exe]]
name = "hexdeterminant_bench"
root = "HexDeterminant.Bench"
